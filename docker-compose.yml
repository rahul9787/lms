services:

  database:
    image: postgres:16-alpine
    container_name: lms-database
    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    networks:
      - lms-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  backend:
  image: ${DOCKERHUB_USERNAME}/lms-backend:${IMAGE_TAG}

    container_name: lms-backend
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_HOST: database
      DB_PORT: 5432

    depends_on:
      database:
        condition: service_healthy

    networks:
      - lms-network

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s


  frontend:
  image: ${DOCKERHUB_USERNAME}/lms-frontend:${IMAGE_TAG}

    container_name: lms-frontend
    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - lms-network

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s


volumes:
  postgres_data:
    name: lms_postgres_data


networks:
  lms-network:
    driver: bridge
